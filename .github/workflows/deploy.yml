name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "130.210.62.71"
          username: "ubuntu"
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/Food-Garden
            git pull origin main
            
            # Update & Build Frontend
            cd frontend
            npm install
            npm run build
            
            # Update & Restart Backend
            cd ../backend
            npm install
            pm2 restart food-garden-backend --update-env
